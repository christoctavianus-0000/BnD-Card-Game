<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#332113" />
      <stop offset="55%" stop-color="#18100a" />
      <stop offset="100%" stop-color="#0f0b08" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f5d076" />
      <stop offset="100%" stop-color="#b88428" />
    </linearGradient>
    <linearGradient id="felt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22332b" />
      <stop offset="100%" stop-color="#101814" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="84" fill="none" stroke="url(#gold)" stroke-width="10" stroke-opacity="0.85" />
  <rect x="44" y="44" width="424" height="424" rx="68" fill="none" stroke="#d4a853" stroke-width="3" stroke-opacity="0.35" />

  <!-- Subtle 2x2 tactical diamond card crest -->
  <g transform="translate(256 244)">
    <polygon points="0,-168 156,0 0,168 -156,0" fill="url(#felt)" stroke="url(#gold)" stroke-width="10" />
    <polygon points="0,-136 124,0 0,136 -124,0" fill="none" stroke="#d4a853" stroke-width="3" stroke-opacity="0.45" />
    <!-- 4-point B'n'D star crest -->
    <path d="M0,-108 C14,-34 34,-14 108,0 C34,14 14,34 0,108 C-14,34 -34,14 -108,0 C-34,-14 -14,-34 0,-108 Z" fill="url(#gold)" />
    <circle cx="0" cy="0" r="24" fill="#18100a" stroke="#fef08a" stroke-width="5" />
    <circle cx="0" cy="0" r="9" fill="#60a5fa" />
  </g>

  <text x="256" y="446" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="44" letter-spacing="6" fill="url(#gold)">B'N'D</text>
</svg>
